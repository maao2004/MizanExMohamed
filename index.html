<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Guard against third-party extension injection errors (e.g. MetaMask inpage.js)
      window.addEventListener('error', function(event) {
        var fn = event.filename || '';
        var msg = event.message || '';
        if (
          fn.indexOf('chrome-extension://') !== -1 ||
          fn.indexOf('moz-extension://') !== -1 ||
          fn.indexOf('inpage.js') !== -1 ||
          msg.indexOf('MetaMask') !== -1 ||
          msg.indexOf('ethereum') !== -1
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        var stack = (reason && reason.stack) || '';
        if (
          msg.indexOf('MetaMask') !== -1 ||
          msg.indexOf('ethereum') !== -1 ||
          stack.indexOf('chrome-extension://') !== -1 ||
          stack.indexOf('inpage.js') !== -1
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
